<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t2 d2">
<title id="t2">총 결제금액이 정산액과 공제 항목으로 나뉘는 구조</title>
<desc id="d2">총 결제금액이 정산 기준액과 차액으로 나뉘고, 정산 기준액에서 별도 공제액이 빠진 금액이 예상 정산액이 되는 분해도</desc>
<defs>
<style>
text{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.bar-lbl{font-size:19px;font-weight:700;fill:#FFFFFF;letter-spacing:-0.3px}
.lbl{font-size:18px;font-weight:700;fill:#1F2430;letter-spacing:-0.3px}
.sub{font-size:14px;fill:#5B6475}
.box-lbl{font-size:14px;font-weight:700;fill:#1B3A6B}
.formula{font-size:22px;font-weight:700;fill:#1F2430;letter-spacing:-0.4px}
.note{font-size:15px;fill:#5B6475}
</style>
</defs>
<rect width="1000" height="520" fill="#FFFFFF"/>
<rect x="64" y="40" width="872" height="58" rx="10" fill="#1F2D5C"/>
<text class="bar-lbl" x="500" y="76" text-anchor="middle">총 결제금액</text>
<g stroke="#6B7280" stroke-width="1.5" fill="none" stroke-linecap="round">
<path d="M64 108 V118 H720 V108"/>
<path d="M392 118 V132"/>
<path d="M732 108 V118 H936 V108"/>
<path d="M834 118 V132"/>
</g>
<rect x="64" y="136" width="656" height="78" rx="10" fill="#EEF1F8" stroke="#1F2D5C" stroke-width="2"/>
<text class="lbl" x="392" y="170" text-anchor="middle">정산 기준액</text>
<text class="sub" x="392" y="196" text-anchor="middle">(총 결제금액 × 정산 기준율)</text>
<rect x="732" y="136" width="204" height="78" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="1.5"/>
<text class="lbl" x="834" y="182" text-anchor="middle">차액</text>
<g stroke="#6B7280" stroke-width="1.5" fill="none" stroke-linecap="round">
<path d="M64 224 V234 H500 V224"/>
<path d="M282 234 V248"/>
<path d="M512 224 V234 H720 V224"/>
<path d="M616 234 V248"/>
</g>
<rect x="64" y="252" width="436" height="64" rx="10" fill="#097CFF"/>
<text class="bar-lbl" x="282" y="291" text-anchor="middle">예상 정산액</text>
<rect x="512" y="252" width="208" height="64" rx="10" fill="#FFFFFF" stroke="#D9DCE3" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="lbl" x="616" y="291" text-anchor="middle">별도 공제액</text>
<rect x="64" y="350" width="872" height="104" rx="12" fill="#F7F8FB" stroke="#D9DCE3" stroke-width="1.5"/>
<text class="box-lbl" x="96" y="386">계산 구조</text>
<text class="formula" x="96" y="426">예상 정산액 = 총 결제금액 × 정산 기준율 − 별도 공제액</text>
<text class="note" x="64" y="492">정산 기준율과 공제 항목은 상품, 결제 수단, 이용 시점에 따라 달라질 수 있습니다.</text>
</svg>
