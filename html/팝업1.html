  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f0f0; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .popup { width: 960px; height: 510px; position: relative; overflow: hidden; background: #0A1E3F; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
  .vb-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 30%, rgba(200,169,106,0.22), transparent 55%), radial-gradient(ellipse at 10% 90%, rgba(18,38,74,0.9), transparent 50%); animation: vbShift 14s ease-in-out infinite; }
  .frame-outer { position: absolute; inset: 18px; border: 1px solid rgba(200,169,106,0.35); border-radius: 4px; pointer-events: none; }
  .frame-inner { position: absolute; inset: 22px; border: 1px solid rgba(200,169,106,0.15); border-radius: 2px; pointer-events: none; }
  .logo { position: absolute; top: 38px; left: 46px; height: 28px; width: auto; display: block; }
  .badge { position: absolute; top: 44px; right: 46px; display: flex; align-items: center; gap: 8px; }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: #C8A96A; }
  .badge .est { color: #C8A96A; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; }
  .badge .since { color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; }
  .gold-dots { position: absolute; left: 46px; top: 88px; display: flex; gap: 4px; }
  .gold-dots span { width: 4px; height: 4px; border-radius: 999px; background: #C8A96A; }
  .gold-dots span:nth-child(2) { opacity: 0.6; }
  .gold-dots span:nth-child(3) { opacity: 0.3; }
  .headline { position: absolute; top: 110px; left: 46px; right: 380px; }
  .headline .h1 { font-size: 46px; font-weight: 800; color: #fff; letter-spacing: -0.025em; line-height: 1.15; text-wrap: pretty; }
  .headline .h1 .gold { color: #E8D5A8; }
  .headline .h1 .grad { background: linear-gradient(90deg, #E8D5A8, #C8A96A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .headline .sub { margin-top: 22px; padding-left: 16px; border-left: 2px solid #C8A96A; font-size: 18px; color: rgba(255,255,255,0.85); font-weight: 500; line-height: 1.6; }
  .headline .sub b { color: #E8D5A8; font-weight: 700; }
  .chips-wrap { position: absolute; left: 46px; top: 320px; }
  .chips-label { font-size: 10px; color: rgba(232,213,168,0.7); letter-spacing: 0.2em; margin-bottom: 8px; font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 5px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(200,169,106,0.4); border-radius: 999px; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .cta-wrap { position: absolute; left: 46px; bottom: 36px; right: 380px; }
