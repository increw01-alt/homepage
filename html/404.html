<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 한국상품권협회</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="요청하신 페이지가 존재하지 않습니다. 한국상품권협회 홈으로 이동해 상품권 할부 구매, 매입, 시세 정보를 확인하세요.">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root { --navy: #0b2a5b; --accent: #00b4c8; --text: #1f2937; --muted: #6b7280; --bg: #f5f7fb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #fff; border-bottom: 1px solid #e5e7eb; }
        header .inner { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
        header img { height: 36px; }
        header a.home { color: var(--navy); text-decoration: none; font-weight: 600; font-size: 14px; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
        .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(11, 42, 91, 0.08); max-width: 640px; width: 100%; padding: 48px 32px; text-align: center; }
        .code { font-size: 72px; font-weight: 800; color: var(--navy); letter-spacing: -2px; line-height: 1; }
        .code span { color: var(--accent); }
        h1 { font-size: 24px; margin: 18px 0 10px; color: var(--navy); }
        p { color: var(--muted); font-size: 15px; line-height: 1.7; }
        .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
        .btn { display: inline-block; padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .15s; }
        .btn:hover { transform: translateY(-1px); }
        .btn.primary { background: var(--navy); color: #fff; }
        .btn.ghost { background: #eef2f8; color: var(--navy); }
        .links { margin-top: 32px; padding-top: 24px; border-top: 1px solid #eef0f4; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; text-align: left; }
        .links a { color: var(--text); text-decoration: none; font-size: 14px; padding: 6px 0; }
        .links a:hover { color: var(--accent); }
        footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 16px; }
        @media (max-width: 480px) { .code { font-size: 56px; } .card { padding: 36px 20px; } .links { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="inner">
            <a href="/" aria-label="한국상품권협회 홈"><img src="/img/logo/logo.png" alt="한국상품권협회 로고"></a>
            <a class="home" href="/">홈으로</a>
        </div>
    </header>
    <main>
        <section class="card">
            <div class="code">4<span>0</span>4</div>
            <h1>페이지를 찾을 수 없습니다</h1>
            <p>주소가 변경되었거나 삭제된 페이지입니다.<br>아래 메뉴에서 원하시는 정보를 찾아보세요.</p>
            <div class="btns">
                <a class="btn primary" href="/">홈으로 이동</a>
                <a class="btn ghost" href="/qna">자주 묻는 질문</a>
            </div>
            <nav class="links" aria-label="주요 페이지">
                <a href="/introduce">협회 소개</a>
                <a href="/shoppingmall">제휴 쇼핑몰 안내</a>
                <a href="/컬쳐랜드-할부구매">컬쳐랜드 할부 구매</a>
                <a href="/백화점상품권-할부구매">백화점상품권 할부 구매</a>
                <a href="/상품권시세">백화점 상품권 시세</a>
                <a href="/상품권딜">상품권 핫딜</a>
            </nav>
        </section>
    </main>
    <footer>© 한국상품권협회 · 사업자등록번호 625-88-02085</footer>
</body>
</html>
