name: 딜 등록 (휴대폰)

# 사용법: GitHub 앱/웹에서 새 Issue를 만들고 본문에 상품 URL을 붙여넣으면
# 자동으로 manual_deals.json 에 등록되고, 수집까지 돌려 사이트에 즉시 반영합니다.
# 11번가는 URL만 있으면 되고, 지마켓·옥션은 "5만원 3.2%" 처럼 액면가와 할인율을 함께 적어주세요.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: deals-write
  cancel-in-progress: false

jobs:
  add:
    # 저장소 소유자가 만든 Issue만 처리 (외부 입력으로 등록되는 것 방지)
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    # 행(hang) 시 과금 폭주 방지 백스톱
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 딜 등록
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python add_deal.py > result.md 2>&1 || true
          cat result.md

      - name: 딜 수집 (즉시 반영)
        id: collect
        if: success()
        continue-on-error: true   # 수집 실패해도 딜 등록 자체는 커밋한다 (아래에서 부분 생성물은 폐기)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect_deals.py

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 수집이 중간에 실패했으면 반쪽 생성물(deals.json·프리렌더)이 섞여 배포되지 않도록
          # html/ 변경을 전부 버리고 딜 등록(manual_deals.json)만 커밋한다.
          # 다음 정시 수집이 등록된 딜을 포함해 전체를 일관되게 재생성한다.
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "수집 실패 - html 부분 생성물 폐기, 등록만 커밋"
            git checkout -- html/
          fi
          # 수집이 프리렌더한 상품권딜.html·sitemap.xml·시세 이력도 함께 커밋 (deals.json 과 어긋나지 않게)
          git add manual_deals.json html/deals.json "html/상품권딜.html" html/sitemap.xml html/rates_history.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 딜 등록 (Issue #${{ github.event.issue.number }})"
            git pull --rebase origin main
            git push
          fi

      - name: 결과 댓글 남기고 Issue 닫기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file result.md
          gh issue close ${{ github.event.issue.number }}

      - name: 자동수집 건강 점검 (0건 지속 시 실행 실패로 알림)
        # collect-deals.yml 의 동일 스텝과 한 쌍 — 이 워크플로의 수집 실행도
        # auto_zero_streak 를 올리므로, 여기서만 24의 배수가 소비되면 정시 워크플로가
        # 배수를 놓쳐 알림이 최대 하루 늦어지는 구멍을 막는다.
        # 맨 끝에 두어 실패해도 딜 등록·커밋·Issue 처리에는 영향이 없다.
        run: |
          streak=$(jq -r '.collect_health.auto_zero_streak // 0' html/deals.json)
          auto=$(jq -r '.collect_health.auto_items // 0' html/deals.json)
          echo "네이버 자동수집 ${auto}건 / 연속 0건 ${streak}회"
          if [ "$streak" -ge 24 ] && [ $((streak % 24)) -eq 0 ]; then
            echo "::error::네이버 자동수집이 ${streak}시간 연속 0건입니다 — API 키·쿼터·신뢰필터를 점검하세요."
            exit 1
          fi
