name: (임시) 네이버 API 진단

# 2026-08-12 자동수집 0건(전 검색어 HTTP 404) 원인 확정용 임시 워크플로.
# 수집 파이프라인과 완전히 분리되어 있고 수동 실행만 가능하며, 아무것도 커밋하지 않는다.
# 원인 확정 후 이 파일은 삭제할 것.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 네이버 API 응답 본문 확인
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error

          CID = os.environ.get("NAVER_CLIENT_ID", "")
          CSEC = os.environ.get("NAVER_CLIENT_SECRET", "")
          # 키 값 자체는 절대 출력하지 않고 존재 여부와 길이만 확인
          print(f"키 주입 상태: ID={'있음' if CID else '없음'}({len(CID)}자), "
                f"SECRET={'있음' if CSEC else '없음'}({len(CSEC)}자)")

          def call(name, url, params):
              full = url + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(full)
              req.add_header("X-Naver-Client-Id", CID)
              req.add_header("X-Naver-Client-Secret", CSEC)
              print(f"\n===== {name} =====")
              print(f"요청: {url}")
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read().decode("utf-8", "replace")
                      data = json.loads(body)
                      print(f"HTTP {r.status} 성공 — total={data.get('total')}, "
                            f"items={len(data.get('items', []))}")
                      if data.get("items"):
                          it = data["items"][0]
                          print(f"  첫 결과: {it.get('title','')[:60]}")
                          print(f"  link   : {it.get('link','')[:90]}")
                          print(f"  mall   : {it.get('mallName','')}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print(f"HTTP {e.code} 실패")
                  print(f"  응답 본문: {body[:500]}")
              except Exception as e:
                  print(f"예외: {type(e).__name__}: {e}")

          # ① 문제의 쇼핑 검색 — 수집 스크립트와 동일한 파라미터
          call("쇼핑 검색 (수집 스크립트와 동일 조건)",
               "https://openapi.naver.com/v1/search/shop.json",
               {"query": "컬쳐랜드 모바일 문화상품권 5만원", "display": 100, "sort": "asc"})

          # ② 쇼핑 검색 — 최소 파라미터 (display/sort 영향 여부 확인)
          call("쇼핑 검색 (최소 파라미터)",
               "https://openapi.naver.com/v1/search/shop.json",
               {"query": "상품권"})

          # ③ 대조군: 블로그 검색 — 키·앱이 살아있는지 확인
          #    ③이 성공하고 ①②만 404면 쇼핑 검색 API만 막힌 것이 확정된다
          call("블로그 검색 (대조군 — 키 생존 확인)",
               "https://openapi.naver.com/v1/search/blog.json",
               {"query": "상품권"})
          PY
