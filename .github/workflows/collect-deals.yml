name: 상품권 딜 자동 수집

on:
  schedule:
    # 매시 정각 (UTC 기준이지만 매시간이므로 KST에서도 매시 정각)
    # 네이버 API 하루 25,000회 한도 대비 실사용은 24회 × 약 20요청 = 480회 수준
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  # add-deal.yml 과 같은 그룹 — 두 워크플로가 같은 파일(deals.json·상품권딜.html)을
  # 커밋하므로 직렬화해 push 경합·리베이스 충돌을 방지한다
  group: deals-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 행(hang) 시 과금 폭주 방지 백스톱 — 정상 실행은 1분 미만
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 딜 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect_deals.py

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # deals.json 과 함께 프리렌더된 상품권딜.html, sitemap.xml, 시세 이력도 커밋
          git add html/deals.json "html/상품권딜.html" html/sitemap.xml html/rates_history.json
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 상품권 딜 자동 갱신 (deals.json·프리렌더)"
            # 사람이 그 사이에 푸시한 커밋과 충돌하지 않도록 리베이스 후 푸시
            git pull --rebase origin main
            git push
          fi

      - name: 자동수집 건강 점검 (0건 지속 시 실행 실패로 알림)
        # 커밋·푸시 뒤에 두었으므로 이 스텝이 실패해도 사이트 갱신은 이미 반영된 상태.
        # 네이버 자동수집이 하루(24회) 연속 0건이면 실행을 실패시켜 GitHub 알림을 띄우고,
        # 장애가 이어지는 동안은 24회마다 하루 한 번씩만 다시 알린다 (매시간 스팸 방지).
        # 배경: 2026-07-31~08-11 네이버 수집이 0건이어도 수동딜 덕에 워크플로가 계속
        # 성공(green)이라 11일간 아무도 몰랐던 사건의 재발 방지.
        run: |
          streak=$(jq -r '.collect_health.auto_zero_streak // 0' html/deals.json)
          auto=$(jq -r '.collect_health.auto_items // 0' html/deals.json)
          echo "네이버 자동수집 ${auto}건 / 연속 0건 ${streak}회"
          if [ "$streak" -ge 24 ] && [ $((streak % 24)) -eq 0 ]; then
            echo "::error::네이버 자동수집이 ${streak}시간 연속 0건입니다 — API 키·쿼터·신뢰필터를 점검하세요."
            exit 1
          fi
