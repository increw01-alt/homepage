name: 상품권 딜 자동 수집

on:
  schedule:
    # 매시 정각 (UTC 기준이지만 매시간이므로 KST에서도 매시 정각)
    # 네이버 API 하루 25,000회 한도 대비 실사용은 24회 × 약 20요청 = 480회 수준
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write
  issues: write   # 고할인 복귀 알림 이슈 생성용

concurrency:
  # add-deal.yml 과 같은 그룹 — 두 워크플로가 같은 파일(deals.json·상품권딜.html)을
  # 커밋하므로 직렬화해 push 경합·리베이스 충돌을 방지한다
  group: deals-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 행(hang) 시 과금 폭주 방지 백스톱 — 정상 실행은 1분 미만
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 딜 수집 실행
        id: deals
        # 딜이 3건 미만이면 collect_deals.py 가 deals.json·상품권딜 프리렌더를 그대로 두고
        # exit 1 한다. 여기서 job 을 멈추면 시세 수집·커밋까지 막혀 상품권시세도 함께
        # 멈춘다(2026-11-02~11-16: 11번가 러너 IP 차단 + 수동딜 일괄 만료로 12일 공백).
        # 그래서 이 스텝 실패로는 job 을 멈추지 않고, 아래 "딜 수집 실패 처리" 스텝에서
        # 실행을 실패로 표시하고 이슈로 알린다.
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect_deals.py

      - name: 시세 수집 실행
        # 상품권 거래소 시세는 핫딜과 별개 파이프라인이다.
        # 여기서 실패해도 핫딜 갱신·커밋은 그대로 진행돼야 하므로 continue-on-error.
        # (수집기 자체도 업체별로 실패를 격리하지만, 전체가 죽는 경우까지 대비한다)
        continue-on-error: true
        run: python collect_rates.py

      - name: 변경 시 커밋 & 푸시
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # deals.json 과 함께 프리렌더된 상품권딜.html, sitemap.xml, 시세 이력도 커밋
          git add html/deals.json "html/상품권딜.html" html/sitemap.xml html/rates_history.json
          # 핫딜 알림 산출물 (수집기가 만드는 파일을 빠뜨리면 아래 rebase 가 실패한다)
          git add html/deal_alerts.json html/deals_rss.xml
          # 11번가 직전 성공값 캐시(배포 대상 아님). 딜 수집이 실패한 실행에서는 아직
          # 없을 수 있어 따로 add 한다 (없는 경로가 섞이면 git add 전체가 실패한다)
          git add live_11st_cache.json || true
          # 상품권 거래소 시세(별개 파이프라인)
          # 주의: 수집기가 만드는 산출물을 하나라도 빠뜨리면 unstaged 로 남아
          # 아래 git pull --rebase 가 "You have unstaged changes" 로 실패한다.
          git add html/rates.json html/rates_market_history.json html/rates_daily_history.json "html/상품권시세.html" || true
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 상품권 딜 자동 갱신 (deals.json·프리렌더)"
            # 사람이 그 사이에 푸시한 커밋과 충돌하지 않도록 리베이스 후 푸시.
            # 같은 파일(프리렌더된 HTML)을 사람이 동시에 고치면 리베이스가 충돌하는데,
            # 여기서 억지로 한쪽을 고르면 사람 작업을 덮어쓸 위험이 있다.
            # 수집 데이터는 다음 정시에 다시 만들어지므로 이번 갱신만 건너뛴다.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::사람이 푸시한 커밋과 충돌 — 이번 갱신을 건너뜁니다(다음 정시에 재시도)."
              exit 0
            fi
            git push
          fi

      - name: 고할인 복귀 알림 (신규 감지 시 GitHub 이슈 생성)
        # 수집기가 상승-교차를 감지한 실행에서만 이슈를 만든다 — 폰의 GitHub 알림으로
        # 받아 채널톡 공지 등 필요한 곳에 공유하는 반자동 알림 체계. 실패해도 수집에는 영향 없음.
        # (github-actions 봇이 만든 이슈는 add-deal.yml 의 소유자 검사에 걸려 딜 등록으로
        #  처리되지 않는다)
        # 딜 수집이 실패한 실행에서는 deals.json 이 직전 값 그대로라 지난번 new_alerts 로
        # 같은 알림 이슈가 매시간 다시 생기므로 건너뛴다.
        if: steps.deals.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(jq -r '.collect_health.new_alerts // 0' html/deals.json)
          if [ "$n" -le 0 ]; then
            echo "신규 알림 없음"
            exit 0
          fi
          summary=$(jq -r --argjson n "$n" '.alerts[:$n][] | "- \(.category) 최고 \(.rate)% (\(.seller))" + (if .price then " \(.price)원" else "" end)' html/deal_alerts.json)
          gh issue create \
            --title "[핫딜알림] $(TZ=Asia/Seoul date '+%m/%d %H시') 고할인 복귀 ${n}건" \
            --body "$(printf '매시간 수집에서 고할인 복귀를 감지했습니다.\n\n%s\n\n페이지: https://koreagiftcard.co.kr/상품권딜\n\n확인 후 채널톡 공지 등 필요한 곳에 공유하시고 이 이슈를 닫아 주세요.' "$summary")" \
            || echo "::warning::알림 이슈 생성 실패 (수집에는 영향 없음)"

      - name: 수동딜 만료 예고 (D-3부터 GitHub 이슈, 해소되면 자동 닫기)
        # 지마켓·옥션 등 수동딜은 checked 후 14일이 지나면 자동으로 노출에서 빠진다.
        # 만료 예고가 실행 로그 경고에만 남아 2026-11-02 17건 일괄 만료를 아무도 못 봤고,
        # 11번가 조회 오류와 겹쳐 12일 수집 공백이 됐다. 그래서 D-3부터 이슈로 알린다.
        # - 만료 임박 딜이 있고 열린 [수동딜만료] 이슈가 없으면 새로 만든다(중복 생성 안 함).
        # - 만료 임박 딜이 없어지면(checked 갱신 또는 만료 경과) 이슈를 닫으며 결과를 남긴다.
        # 딜 수집이 실패한 실행은 deals.json 이 직전 값이라 판단하지 않는다.
        # (github-actions 봇이 만든 이슈는 add-deal.yml 의 소유자 검사에 걸려 딜 등록으로
        #  처리되지 않는다)
        if: steps.deals.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(jq -r '.collect_health.manual_expiring // [] | length' html/deals.json)
          expired=$(jq -r '.collect_health.manual_expired // 0' html/deals.json)
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[수동딜만료]"))][0].number // empty') \
            || { echo "::warning::이슈 목록 조회 실패 (수집에는 영향 없음)"; exit 0; }
          echo "만료 임박 수동딜 ${n}건 / 만료 제외 ${expired}건 / 열린 이슈 ${open:-없음}"
          if [ "$n" -gt 0 ]; then
            if [ -n "$open" ]; then
              echo "이미 열린 만료 예고 이슈 #${open} 이 있어 새로 만들지 않습니다."
              exit 0
            fi
            list=$(jq -r '.collect_health.manual_expiring[] | "- " + .' html/deals.json)
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "[수동딜만료] $(TZ=Asia/Seoul date '+%m/%d') 만료 임박 수동딜 ${n}건" \
              --body "$(printf '아래 수동딜이 곧 노출에서 제외됩니다(checked 후 14일 경과 시 자동 제외).\n\n%s\n\n판매처에서 가격을 다시 확인한 뒤 manual_deals.json 의 checked 를 갱신해 주세요.\n모든 딜이 11번가 조회 오류와 겹쳐 3건 미만이 되면 상품권딜 수집이 실패합니다.\n만료 임박 딜이 없어지면 이 이슈는 자동으로 닫힙니다.' "$list")" \
              || echo "::warning::만료 예고 이슈 생성 실패 (수집에는 영향 없음)"
          elif [ -n "$open" ]; then
            if [ "$expired" -gt 0 ]; then
              msg="만료 임박 딜이 없어졌습니다. 현재 만료로 노출에서 제외된 수동딜은 ${expired}건입니다 — manual_deals.json 의 checked 를 갱신하면 다시 노출됩니다."
            else
              msg="checked 갱신으로 만료 임박 수동딜이 모두 해소됐습니다."
            fi
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "$msg" \
              || echo "::warning::만료 예고 이슈 닫기 실패"
          fi

      - name: 자동 갱신 건강 점검 (0건 지속 시 실행 실패로 알림)
        # 커밋·푸시 뒤에 두었으므로 이 스텝이 실패해도 사이트 갱신은 이미 반영된 상태.
        # 감시 대상은 11번가 실시간 조회 건수 — 네이버 쇼핑 검색 API 가 2026-07-31
        # 폐지(SE05)된 뒤로 이것이 유일한 자동 갱신 경로다. 하루(24회) 연속 0건이면
        # 실행을 실패시켜 GitHub 알림을 띄우고, 이후에는 24회마다 하루 한 번만 다시
        # 알린다 (매시간 스팸 방지).
        # 배경: 2026-07-31~08-11 자동수집이 0건이어도 수동딜 덕에 워크플로가 계속
        # 성공(green)이라 11일간 아무도 몰랐던 사건의 재발 방지.
        run: |
          streak=$(jq -r '.collect_health.live_zero_streak // 0' html/deals.json)
          live=$(jq -r '.collect_health.live_items // 0' html/deals.json)
          echo "11번가 실시간 조회 ${live}건 / 연속 0건 ${streak}회"
          if [ "$streak" -ge 24 ] && [ $((streak % 24)) -eq 0 ]; then
            echo "::error::11번가 실시간 조회가 ${streak}시간 연속 0건입니다 — 자동 검증되는 딜이 없습니다. 11번가 페이지 구조 변경·전량 품절 여부를 점검하세요."
            exit 1
          fi

          # 시세 수집 감시 — 업체 절반 미만이 3회 연속이면 파서가 깨진 것으로 본다.
          # (한 곳이 사이트를 개편하는 것은 흔하지만, 절반이 동시에 깨지는 일은 드물다)
          rlow=$(jq -r '.collect_health.shop_low_streak // 0' html/rates.json 2>/dev/null || echo 0)
          rok=$(jq -r '.collect_health.shops_ok // 0' html/rates.json 2>/dev/null || echo 0)
          rtot=$(jq -r '.collect_health.shops_total // 0' html/rates.json 2>/dev/null || echo 0)
          echo "시세 수집 업체 ${rok}/${rtot}곳 / 절반 미만 연속 ${rlow}회"
          if [ "$rlow" -ge 3 ]; then
            echo "::error::시세 수집 업체가 ${rlow}회 연속 절반 미만입니다(${rok}/${rtot}) — tests/fixtures 를 갱신하고 파서를 점검하세요."
            exit 1
          fi

      - name: 딜 수집 실패 처리
        # 딜 수집 스텝은 continue-on-error 라 실패해도 job 이 green 으로 끝난다.
        # 시세 수집·커밋을 마친 뒤 여기서 실행을 실패로 표시해 장애가 묻히지 않게 한다.
        if: always() && steps.deals.outcome == 'failure'
        run: |
          echo "::error::딜 수집이 실패했습니다 — 상품권딜(deals.json·프리렌더)은 직전 데이터를 유지하고, 시세 수집·커밋은 진행했습니다. '딜 수집 실행' 스텝 로그를 확인하세요."
          exit 1

      - name: 수집 실패 알림 (GitHub 이슈, 열린 이슈가 있으면 생략)
        # 딜 수집 또는 커밋·푸시가 실패하면 첫 실패 시점에 이슈를 만든다 — 폰의 GitHub
        # 알림으로 바로 받기 위함. 같은 장애로 매시간 이슈가 쌓이지 않도록 열린
        # [수집실패] 이슈가 있으면 새로 만들지 않는다. 건강 점검 스텝 실패(11번가 24회
        # 연속 0건 등)는 기존처럼 실행 실패 알림만 쓴다.
        # (github-actions 봇이 만든 이슈는 add-deal.yml 의 소유자 검사에 걸려 딜 등록으로
        #  처리되지 않는다)
        if: always() && (steps.deals.outcome == 'failure' || steps.commit.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEALS_OUTCOME: ${{ steps.deals.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[수집실패]"))][0].number // empty')
          if [ -n "$open" ]; then
            echo "이미 열린 수집 실패 이슈 #${open} 이 있어 새로 만들지 않습니다."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[수집실패] $(TZ=Asia/Seoul date '+%m/%d %H시') 상품권 자동 수집 실패" \
            --body "$(printf '매시간 자동 수집이 실패했습니다.\n\n- 딜 수집: %s\n- 커밋·푸시: %s\n- 실행 로그: %s\n\n딜 수집 실패 시 상품권딜 페이지는 직전 데이터를 유지합니다. 11번가 조회 오류(502/503)와 manual_deals.json 의 checked 만료 여부를 먼저 확인하세요.\n수집이 다시 성공하면 이 이슈는 자동으로 닫힙니다.' "$DEALS_OUTCOME" "$COMMIT_OUTCOME" "$RUN_URL")" \
            || echo "::warning::수집 실패 알림 이슈 생성 실패"

      - name: 수집 정상화 시 실패 이슈 닫기
        # 열린 [수집실패] 이슈가 남아 있으면 다음 장애 때 새 이슈가 생략되므로,
        # 딜 수집과 커밋이 다시 성공하면 자동으로 닫는다.
        if: always() && steps.deals.outcome == 'success' && steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
              --jq '.[] | select(.title | startswith("[수집실패]")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "자동 수집이 다시 성공했습니다: $RUN_URL" \
              || echo "::warning::이슈 #${n} 닫기 실패"
          done
