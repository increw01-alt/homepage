name: 상품권 딜 자동 수집

on:
  schedule:
    # 매시 정각 (UTC 기준이지만 매시간이므로 KST에서도 매시 정각)
    # 네이버 API 하루 25,000회 한도 대비 실사용은 24회 × 약 20요청 = 480회 수준
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  # add-deal.yml 과 같은 그룹 — 두 워크플로가 같은 파일(deals.json·상품권딜.html)을
  # 커밋하므로 직렬화해 push 경합·리베이스 충돌을 방지한다
  group: deals-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 행(hang) 시 과금 폭주 방지 백스톱 — 정상 실행은 1분 미만
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 딜 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect_deals.py

      - name: 시세 수집 실행
        # 상품권 거래소 시세는 핫딜과 별개 파이프라인이다.
        # 여기서 실패해도 핫딜 갱신·커밋은 그대로 진행돼야 하므로 continue-on-error.
        # (수집기 자체도 업체별로 실패를 격리하지만, 전체가 죽는 경우까지 대비한다)
        continue-on-error: true
        run: python collect_rates.py

      - name: 변경 시 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # deals.json 과 함께 프리렌더된 상품권딜.html, sitemap.xml, 시세 이력도 커밋
          git add html/deals.json "html/상품권딜.html" html/sitemap.xml html/rates_history.json
          # 상품권 거래소 시세(별개 파이프라인)
          git add html/rates.json "html/상품권시세.html" || true
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: 상품권 딜 자동 갱신 (deals.json·프리렌더)"
            # 사람이 그 사이에 푸시한 커밋과 충돌하지 않도록 리베이스 후 푸시
            git pull --rebase origin main
            git push
          fi

      - name: 자동 갱신 건강 점검 (0건 지속 시 실행 실패로 알림)
        # 커밋·푸시 뒤에 두었으므로 이 스텝이 실패해도 사이트 갱신은 이미 반영된 상태.
        # 감시 대상은 11번가 실시간 조회 건수 — 네이버 쇼핑 검색 API 가 2026-07-31
        # 폐지(SE05)된 뒤로 이것이 유일한 자동 갱신 경로다. 하루(24회) 연속 0건이면
        # 실행을 실패시켜 GitHub 알림을 띄우고, 이후에는 24회마다 하루 한 번만 다시
        # 알린다 (매시간 스팸 방지).
        # 배경: 2026-07-31~08-11 자동수집이 0건이어도 수동딜 덕에 워크플로가 계속
        # 성공(green)이라 11일간 아무도 몰랐던 사건의 재발 방지.
        run: |
          streak=$(jq -r '.collect_health.live_zero_streak // 0' html/deals.json)
          live=$(jq -r '.collect_health.live_items // 0' html/deals.json)
          echo "11번가 실시간 조회 ${live}건 / 연속 0건 ${streak}회"
          if [ "$streak" -ge 24 ] && [ $((streak % 24)) -eq 0 ]; then
            echo "::error::11번가 실시간 조회가 ${streak}시간 연속 0건입니다 — 자동 검증되는 딜이 없습니다. 11번가 페이지 구조 변경·전량 품절 여부를 점검하세요."
            exit 1
          fi

          # 시세 수집 감시 — 업체 절반 미만이 3회 연속이면 파서가 깨진 것으로 본다.
          # (한 곳이 사이트를 개편하는 것은 흔하지만, 절반이 동시에 깨지는 일은 드물다)
          rlow=$(jq -r '.collect_health.shop_low_streak // 0' html/rates.json 2>/dev/null || echo 0)
          rok=$(jq -r '.collect_health.shops_ok // 0' html/rates.json 2>/dev/null || echo 0)
          rtot=$(jq -r '.collect_health.shops_total // 0' html/rates.json 2>/dev/null || echo 0)
          echo "시세 수집 업체 ${rok}/${rtot}곳 / 절반 미만 연속 ${rlow}회"
          if [ "$rlow" -ge 3 ]; then
            echo "::error::시세 수집 업체가 ${rlow}회 연속 절반 미만입니다(${rok}/${rtot}) — tests/fixtures 를 갱신하고 파서를 점검하세요."
            exit 1
          fi
